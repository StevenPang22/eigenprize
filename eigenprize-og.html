<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#888;display:flex;align-items:center;justify-content:center;min-height:100vh}

.card{
  width:1200px;height:630px;
  background:#f7f6f3;
  font-family:'EB Garamond',Georgia,serif;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:64px;
}

.amount{
  font-size:176px;
  font-weight:700;
  color:#1a1a18;
  letter-spacing:-0.04em;
  line-height:.85;
}

.div{
  width:1px;
  height:140px;
  background:#d0cdc6;
}

.mid{display:flex;flex-direction:column}

.title{
  font-size:48px;
  font-weight:700;
  color:#1a1a18;
  letter-spacing:-0.02em;
}

.lambda{
  font-weight:400;
  color:#b8a080;
  font-style:italic;
}

.sub{
  font-size:20px;
  color:#888;
  margin-top:8px;
}
</style>
</head>
<body>
<div class="card">
  <div class="amount">$100k</div>
  <div class="div"></div>
  <div class="mid">
    <div class="title"><span class="lambda">λ </span>The Eigenprize</div>
    <div class="sub">for builders, scientists & operators.</div>
  </div>
</div>
</body>
</html>
